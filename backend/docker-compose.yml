# Local development stack: api + postgres + minio.
#
# Host ports are offset (55432, 59000) so this cannot collide with a PostgreSQL or MinIO
# already running on the machine.
#
#   docker compose up -d          # everything
#   docker compose up -d postgres minio   # just the dependencies, for running tests on the host
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrovision-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Service names, not localhost: inside the compose network these resolve to the
      # containers, and the published host ports are irrelevant here.
      AGROVISION_DATABASE__URL: postgresql+asyncpg://agrovision:agrovision@postgres:5432/agrovision
      AGROVISION_STORAGE__BACKEND: s3
      AGROVISION_STORAGE__ENDPOINT_URL: http://minio:9000
      AGROVISION_STORAGE__ACCESS_KEY: agrovision
      AGROVISION_STORAGE__SECRET_KEY: agrovision-secret
      AGROVISION_STORAGE__BUCKET: agrovision-images
      # No model file ships with the repository, so a local stack would otherwise refuse to
      # boot. Mount real weights at /srv/models and drop this to run against them.
      AGROVISION_MODEL__ALLOW_DEMO: "1"
      AGROVISION_ENVIRONMENT: dev
      AGROVISION_LOG_JSON: "1"
      AGROVISION_CORS_ORIGINS: '["http://localhost:58000"]'
      AGROVISION_RAG__ENABLED: "1"
      AGROVISION_RAG__API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "58000:8000"
    volumes:
      # Read-only: the process should never be able to modify its own weights.
      - ./models:/srv/models:ro

  postgres:
    image: postgres:16-alpine
    container_name: agrovision-pg
    environment:
      POSTGRES_USER: agrovision
      POSTGRES_PASSWORD: agrovision
      POSTGRES_DB: agrovision_test
    ports:
      - "55432:5432"
    volumes:
      - agrovision-pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory. Creates the application database beside the
      # test one, so the suite's drop_all cannot wipe local development data.
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovision -d agrovision_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible object storage. Images are far too numerous to keep in the database and
  # must be reachable by a browser, which a server filesystem path is not.
  minio:
    image: minio/minio:latest
    container_name: agrovision-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agrovision
      MINIO_ROOT_PASSWORD: agrovision-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - agrovision-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  agrovision-pgdata:
  agrovision-miniodata:
