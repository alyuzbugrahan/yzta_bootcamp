name: backend

on:
  push:
    branches: [master, main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    # Service containers rather than docker compose: the runner reaches these on localhost,
    # and the health checks gate the job so the suite never starts against a database that is
    # still booting.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: figion
          POSTGRES_PASSWORD: figion
          POSTGRES_DB: figion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U figion -d figion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: figion
          MINIO_ROOT_PASSWORD: figion-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,onnx]'

      - name: Lint
        run: ruff check app tests alembic tools

      # PostgreSQL and MinIO are the deployment targets. Running only against SQLite and the
      # local filesystem would leave the dialect-specific and S3-specific paths untested — the
      # suite skips those rather than failing, and skipped is not passed.
      - name: Test
        env:
          FIGION_TEST_DATABASE_URL: postgresql+asyncpg://figion:figion@localhost:5432/figion_test
          FIGION_TEST_S3_ENDPOINT: http://localhost:9000
          FIGION_TEST_S3_ACCESS_KEY: figion
          FIGION_TEST_S3_SECRET_KEY: figion-secret
        run: pytest tests -q

      - name: Fail if the real backends were skipped
        env:
          FIGION_TEST_DATABASE_URL: postgresql+asyncpg://figion:figion@localhost:5432/figion_test
          FIGION_TEST_S3_ENDPOINT: http://localhost:9000
          FIGION_TEST_S3_ACCESS_KEY: figion
          FIGION_TEST_S3_SECRET_KEY: figion-secret
        run: |
          # A misconfigured service container would otherwise turn into a silent green run,
          # because the storage and dialect tests skip when their endpoint is absent.
          pytest tests/infra/test_storage.py tests/infra/test_dialect_behaviour.py -q -rs \
            | tee /tmp/backends.txt
          if grep -q "SKIPPED" /tmp/backends.txt; then
            echo "::error::PostgreSQL or MinIO tests were skipped — service containers are not reachable"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: figion-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image boots, applies its migrations and serves traffic — not merely that it
      # compiled. A container that builds and then crashes on startup is the failure mode a
      # build-only job misses.
      - name: Smoke test the image
        run: |
          docker run -d --name figion-smoke \
            -e FIGION_MODEL__ALLOW_DEMO=1 \
            -e FIGION_STORAGE__ENABLED=false \
            -e FIGION_DATABASE__URL=sqlite+aiosqlite:////tmp/smoke.db \
            -p 8000:8000 figion-backend:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then
              echo "container is serving"
              curl -fsS http://127.0.0.1:8000/api/v1/health/ready
              docker rm -f figion-smoke
              exit 0
            fi
            sleep 2
          done

          echo "::error::container never became healthy"
          docker logs figion-smoke
          docker rm -f figion-smoke
          exit 1
